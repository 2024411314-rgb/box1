<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Car</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  body { margin: 0; overflow: hidden; }
</style>
</head>
<body>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <a-entity
        scale="0.4 0.4 0.4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">

        <!-- Body -->
        <a-box position="0 0.4 0" width="2" height="0.5" depth="1" color="red"></a-box>

        <!-- Cabin and windows -->
        <a-box position="-0.1 0.85 0" width="1" height="0.4" depth="0.9" color="#c0392b"></a-box>
        <a-box position="-0.1 0.88 0" width="1.02" height="0.25" depth="0.92" color="#9ad4f5"></a-box>

        <!-- Wheels -->
        <a-cylinder position="0.65 0.25 0.5"  radius="0.25" height="0.2" rotation="90 0 0" color="#222"></a-cylinder>
        <a-cylinder position="0.65 0.25 -0.5" radius="0.25" height="0.2" rotation="90 0 0" color="#222"></a-cylinder>
        <a-cylinder position="-0.65 0.25 0.5"  radius="0.25" height="0.2" rotation="90 0 0" color="#222"></a-cylinder>
        <a-cylinder position="-0.65 0.25 -0.5" radius="0.25" height="0.2" rotation="90 0 0" color="#222"></a-cylinder>

        <!-- Headlights -->
        <a-sphere position="1 0.45 0.3"  radius="0.1" color="yellow"></a-sphere>
        <a-sphere position="1 0.45 -0.3" radius="0.1" color="yellow"></a-sphere>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>

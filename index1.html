<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple 3D Cube</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f0;
    font-family: sans-serif;
  }

  .scene {
    width: 150px;
    height: 150px;
    perspective: 600px;
  }

  .cube {
    width: 150px;
    height: 150px;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 8s linear infinite;
  }

  .face {
    position: absolute;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    border: 2px solid white;
    box-sizing: border-box;
  }

  .front  { background: red;    transform: translateZ(75px); }
  .back   { background: orange; transform: rotateY(180deg) translateZ(75px); }
  .right  { background: green;  transform: rotateY(90deg) translateZ(75px); }
  .left   { background: blue;   transform: rotateY(-90deg) translateZ(75px); }
  .top    { background: purple; transform: rotateX(90deg) translateZ(75px); }
  .bottom { background: teal;   transform: rotateX(-90deg) translateZ(75px); }

  @keyframes spin {
    to { transform: rotateX(360deg) rotateY(360deg); }
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="cube">
      <div class="face front">Front</div>
      <div class="face back">Back</div>
      <div class="face right">Right</div>
      <div class="face left">Left</div>
      <div class="face top">Top</div>
      <div class="face bottom">Bottom</div>
    </div>
  </div>

</body>
</html>
